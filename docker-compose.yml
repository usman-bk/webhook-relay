services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relay
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment: &env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/relay
      RELAY_API_TOKEN: change-me
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    build: .
    command: ["python", "-m", "relay.worker"]
    environment: *env
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 2
